name: Build APK from Project ZIP

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q project.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify
        working-directory: project
        run: node scripts/verify-final-release.mjs

      - name: Install
        working-directory: project
        run: npm install

      - name: Build web
        working-directory: project
        run: npm run build -- --target esnext

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: project
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahriar-game-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
