name: Build APK from Project ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q project.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify
        working-directory: project
        run: node scripts/verify-final-release.mjs

      - name: Install
        working-directory: project
        run: npm install && npm install -D typescript

      - name: Build web
        working-directory: project
        run: npm run build -- --target esnext

      - name: Sync Android
        working-directory: project
        run: |
          rm -f capacitor.config.ts
          printf '{"appId":"com.shahriar.game","appName":"Shahriar Game","webDir":"dist"}' > capacitor.config.json
          npx cap sync android

      - name: Make Gradle executable
        working-directory: project
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: project/android
        run: |
          sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/' settings.gradle
          printf "\ninclude ':capacitor-android'\nproject(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')\n" >> settings.gradle
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahriar-game-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
